<section class="photos">
  <app-photo-grid [photos]="photos()" (photoClick)="addToFavorites($event)" />

  <div
    class="photos-loader"
    appInfiniteScroll
    [scrollDisabled]="loading()"
    (scrolled)="loadPhotos()"
  >
    @if (loading()) {
      <mat-spinner diameter="40" />
    }
  </div>
</section>
